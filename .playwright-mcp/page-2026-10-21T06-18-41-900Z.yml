                  - /url: https://github.com/harry-sandhu/Campfire
              - text: "- internal ticketing system. Permission model (groups, roles, audit log) backed by integration and e2e tests instead of assumed correct."
              - link "Live demo" [ref=f3e130] [cursor=pointer]:
                - /url: https://www.autodao.tech
            - paragraph [ref=f3e131]:
              - strong [ref=f3e132]:
                - link "ROTOR" [ref=f3e133] [cursor=pointer]:
                  - /url: https://github.com/harry-sandhu/ROTOR
              - text: "- drone-building tool where compatibility rules live in a typed API instead of a warning dialog, so a bad configuration can't reach the screen."
            - paragraph [ref=f3e134]:
              - strong [ref=f3e135]:
                - link "FloppyRogue" [ref=f3e136] [cursor=pointer]:
                  - /url: https://github.com/harry-sandhu/FLOPPYROUGE
              - text: "- roguelite built to fit on a 1.44MB floppy disk, 1,474,560 bytes, no exceptions. No engine, software-rendered, audio synthesized in code instead of shipped as files."
            - paragraph [ref=f3e137]:
              - strong [ref=f3e138]:
                - link "Web3-encrypted-files-vault" [ref=f3e139] [cursor=pointer]:
                  - /url: https://github.com/harry-sandhu/Web3-encrypted-files-vault
              - text: "- file vault where the server never sees a plaintext file or a key. Encryption happens client-side with AES-GCM, key derived from a wallet signature plus a PIN."
            - paragraph [ref=f3e140]:
              - strong [ref=f3e141]:
                - link "website-auditor" [ref=f3e142] [cursor=pointer]:
                  - /url: https://github.com/harry-sandhu/website-crawler
              - text: "- CLI that drives a real browser instead of just parsing HTML, then audits SEO, accessibility, performance, and security. Active checks stay scoped to the target host and rate-limited by default."
